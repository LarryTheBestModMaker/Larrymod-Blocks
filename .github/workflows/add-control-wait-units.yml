name: Add control wait minute and hour messages

on:
  push:
    branches:
      - develop-builds

permissions:
  contents: write

jobs:
  patch-built-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: develop-builds

      - name: Patch vertical bundles
        shell: python
        run: |
          from pathlib import Path
          import re

          files = [
              Path('dist/vertical.js'),
              Path('dist/web/vertical.js')
          ]

          english = "Blockly.Msg.CONTROL_WAIT = 'wait %1 seconds';"
          english_insert = (
              "Blockly.Msg.CONTROL_WAIT_MINUTES = 'wait %1 minutes';\\n"
              "Blockly.Msg.CONTROL_WAIT_HOURS = 'wait %1 hours';"
          )

          locale_pattern = re.compile(r'(?m)^(?P<indent>[^\\S\\r\\n]*)(?P<prefix>\\\\\\\"CONTROL_WAIT\\\\\\\":\\s*\\\\\\\")(?P<value>.*?)(?P<suffix>\\\\\\\",)$')

          for path in files:
              text = path.read_text(encoding='utf-8')

              if 'CONTROL_WAIT_MINUTES' not in text:
                  text, english_count = text.replace(
                      english,
                      english + '\\n' + english_insert,
                      1
                  ), 0
                  if 'CONTROL_WAIT_MINUTES' in text:
                      english_count = 1

                  def add_locale(match):
                      indent = match.group('indent')
                      value = match.group('value')
                      # Keep the new entries available in every embedded locale.
                      return (
                          f'{indent}\\\\\\"CONTROL_WAIT\\\\\\": \\\\\\\"{value}\\\\\\\",\\n'
                          f'{indent}\\\\\\"CONTROL_WAIT_MINUTES\\\\\\": \\\\\\\"wait %1 minutes\\\\\\\",\\n'
                          f'{indent}\\\\\\"CONTROL_WAIT_HOURS\\\\\\": \\\\\\\"wait %1 hours\\\\\\\",'
                      )

                  # Avoid touching the English JS assignment; only JSON-style locale entries match.
                  text, locale_count = locale_pattern.subn(add_locale, text)
              else:
                  english_count = 0
                  locale_count = 0

              path.write_text(text, encoding='utf-8')
              print(f'{path}: english={english_count}, locale_entries={locale_count}')

      - name: Verify
        shell: bash
        run: |
          set -e
          for file in dist/vertical.js dist/web/vertical.js; do
            test -f "$file"
            grep -q "CONTROL_WAIT_MINUTES" "$file"
            grep -q "CONTROL_WAIT_HOURS" "$file"
          done

      - name: Commit and push
        shell: bash
        run: |
          set -e
          rm -f .github/workflows/add-control-wait-units.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/vertical.js dist/web/vertical.js .github/workflows/add-control-wait-units.yml
          git diff --cached --quiet && exit 0
          git commit -m "Add control wait minutes and hours"
          git push origin develop-builds
