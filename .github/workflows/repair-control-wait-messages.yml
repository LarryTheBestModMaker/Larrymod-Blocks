name: Repair control wait messages in built bundles

on:
  push:
    branches:
      - develop-builds

permissions:
  contents: write

jobs:
  repair-built-bundles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: develop-builds

      - name: Restore clean bundle baseline and add wait units
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          baseline = 'c26b39ff9acc9550e1d8857c8edb2195763dee9f'
          paths = [Path('dist/vertical.js'), Path('dist/web/vertical.js')]

          subprocess.run([
              'git', 'fetch', '--no-tags', 'origin', baseline, '--depth=1'
          ], check=True)
          subprocess.run([
              'git', 'checkout', baseline, '--',
              'dist/vertical.js', 'dist/web/vertical.js'
          ], check=True)

          english_needle = b"Blockly.Msg.CONTROL_WAIT = 'wait %1 seconds';\\nBlockly.Msg.CONTROL_WAITSECONDSORUNTIL"
          english_replacement = (
              b"Blockly.Msg.CONTROL_WAIT = 'wait %1 seconds';\\n"
              b"Blockly.Msg.CONTROL_WAIT_MINUTES = 'wait %1 minutes';\\n"
              b"Blockly.Msg.CONTROL_WAIT_HOURS = 'wait %1 hours';\\n"
              b"Blockly.Msg.CONTROL_WAITSECONDSORUNTIL"
          )

          # Locale JSON is embedded in escaped strings. Support one or more
          # escape slashes before JSON quotes so the patch works with either
          # generated escaping form while preserving the bundle's structure.
          locale_pattern = re.compile(
              rb'(\\+)"CONTROL_WAIT(\\+)":\\s*(\\+)"((?:\\.|[^"\\])*)(\\+)",'
          )

          def locale_replacement(match):
              key_open, key_close, quote_open, value, quote_close = match.groups()
              minutes = (
                  key_open + b'"CONTROL_WAIT_MINUTES' + key_close +
                  b'": ' + quote_open + b'wait %1 minutes' + quote_close + b'",'
              )
              hours = (
                  key_open + b'"CONTROL_WAIT_HOURS' + key_close +
                  b'": ' + quote_open + b'wait %1 hours' + quote_close + b'",'
              )
              return (
                  match.group(0) +
                  b'\\n' + minutes +
                  b'\\n' + hours
              )

          for path in paths:
              text = path.read_bytes()

              if english_needle not in text:
                  raise SystemExit(f'{path}: English CONTROL_WAIT insertion point not found')
              text = text.replace(english_needle, english_replacement, 1)

              original_locale_count = len(locale_pattern.findall(text))
              if original_locale_count == 0:
                  raise SystemExit(f'{path}: no locale CONTROL_WAIT entries were found')

              text, locale_count = locale_pattern.subn(locale_replacement, text)

              # The English entry is one occurrence; every locale occurrence
              # should now have a minute/hour pair beside it.
              minutes_count = text.count(b'CONTROL_WAIT_MINUTES')
              hours_count = text.count(b'CONTROL_WAIT_HOURS')
              if minutes_count < original_locale_count or hours_count < original_locale_count:
                  raise SystemExit(
                      f'{path}: expected at least {original_locale_count} localized pairs, '
                      f'got minutes={minutes_count}, hours={hours_count}'
                  )

              path.write_bytes(text)
              print(
                  f'{path}: locale_entries={locale_count}, '
                  f'minutes_keys={minutes_count}, hours_keys={hours_count}'
              )

          for accidental in (Path('README.md'), Path('dummy-noop.txt')):
              if accidental.exists():
                  accidental.unlink()

      - name: Verify
        shell: bash
        run: |
          set -e
          node --check dist/vertical.js
          node --check dist/web/vertical.js
          grep -q "CONTROL_WAIT_MINUTES" dist/vertical.js
          grep -q "CONTROL_WAIT_HOURS" dist/vertical.js
          grep -q "CONTROL_WAIT_MINUTES" dist/web/vertical.js
          grep -q "CONTROL_WAIT_HOURS" dist/web/vertical.js
          git diff --check

      - name: Commit repaired bundles
        shell: bash
        run: |
          set -e
          rm -f .github/workflows/repair-control-wait-messages.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dist/vertical.js dist/web/vertical.js README.md dummy-noop.txt .github/workflows/repair-control-wait-messages.yml
          git diff --cached --quiet && exit 0
          git commit -m "Add control wait minutes and hours"
          git push origin develop-builds
